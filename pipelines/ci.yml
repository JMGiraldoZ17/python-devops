trigger: none

pr:
  branches:
    include:
      - dev

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: |
      python -m pip install --upgrade pip
      pip install -r app/requirements.txt
    displayName: Install dependencies

  - script: |
      python -m pytest app
    displayName: Run unit tests
